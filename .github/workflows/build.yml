name: Build macOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ZoomKeMouse.app (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout Repository (with Tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version from Git Tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && -n "${GITHUB_REF_NAME}" ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          else
            RAW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi
          APP_VERSION="${RAW_TAG#v}"
          BUILD_NUMBER=$(git rev-list --count HEAD 2>/dev/null || echo "1")
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Resolved Version: ${APP_VERSION} (Build ${BUILD_NUMBER})"

      - name: Build ZoomKeMouse.app (x86_64 & arm64 Universal Binary)
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          mkdir -p ZoomKeMouse.app/Contents/MacOS
          mkdir -p ZoomKeMouse.app/Contents/Resources

          SDK_PATH=$(xcrun --show-sdk-path)

          swiftc -O \
            -target x86_64-apple-macosx13.0 \
            -sdk "${SDK_PATH}" \
            -framework AppKit -framework SwiftUI -framework QuartzCore -framework Metal \
            -framework IOSurface -framework ScreenCaptureKit -framework AVFoundation \
            -framework VideoToolbox -framework CoreGraphics -framework CoreImage \
            -framework CoreMedia -framework CoreVideo -framework UniformTypeIdentifiers \
            Sources/*.swift -o /tmp/ZoomKeMouse_x86_64

          swiftc -O \
            -target arm64-apple-macosx13.0 \
            -sdk "${SDK_PATH}" \
            -framework AppKit -framework SwiftUI -framework QuartzCore -framework Metal \
            -framework IOSurface -framework ScreenCaptureKit -framework AVFoundation \
            -framework VideoToolbox -framework CoreGraphics -framework CoreImage \
            -framework CoreMedia -framework CoreVideo -framework UniformTypeIdentifiers \
            Sources/*.swift -o /tmp/ZoomKeMouse_arm64

          lipo -create -output ZoomKeMouse.app/Contents/MacOS/ZoomKeMouse /tmp/ZoomKeMouse_x86_64 /tmp/ZoomKeMouse_arm64
          cp Assets/AppIcon.icns ZoomKeMouse.app/Contents/Resources/AppIcon.icns

          cat > ZoomKeMouse.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ZoomKeMouse</string>
              <key>CFBundleIdentifier</key>
              <string>com.cutefishaep.zoomkmouse</string>
              <key>CFBundleName</key>
              <string>Zoom Ke Mouse</string>
              <key>CFBundleDisplayName</key>
              <string>Zoom Ke Mouse</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${BUILD_NUMBER}</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSScreenCaptureUsageDescription</key>
              <string>Zoom Ke Mouse memerlukan izin rekam layar untuk menangkap tampilan layar atau jendela aplikasi Mac Anda dan membuat efek Auto-Zoom.</string>
          </dict>
          </plist>
          EOF

          codesign --force --deep --identifier "com.cutefishaep.zoomkmouse" --sign - ZoomKeMouse.app

          mkdir -p dmg_staging
          cp -R ZoomKeMouse.app dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create \
            -volname "Zoom Ke Mouse v${APP_VERSION}" \
            -srcfolder dmg_staging \
            -ov \
            -format UDZO \
            "ZoomKeMouse-v${APP_VERSION}-macOS.dmg"

      - name: Upload Build Artifact (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: ZoomKeMouse-v${{ steps.version.outputs.app_version }}-macOS-dmg
          path: ZoomKeMouse-v${{ steps.version.outputs.app_version }}-macOS.dmg

      - name: Create GitHub Release (on Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ZoomKeMouse-v${{ steps.version.outputs.app_version }}-macOS.dmg
          generate_release_notes: true

